name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: 린트·타입·단위 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  e2e:
    name: 빌드·e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:production
      - name: 빌드 결과 넘기기
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
          retention-days: 1
      - name: 실패하면 Playwright 결과를 남긴다
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  deploy:
    name: Cloudflare 배포
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://typography-playground.seungwoo7050.workers.dev
    steps:
      - uses: actions/checkout@v5
      - name: 빌드 결과 받기
        uses: actions/download-artifact@v4
        with:
          name: out
          path: out/
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.146.0 deploy
      # 게이트의 e2e는 serve로 띄운 out/을 검증할 뿐이라 Cloudflare의 경로
      # 해석·404 처리까지 보장하지 않는다 — 배포된 주소에 대해 두 라우트,
      # 키네틱 엔진이 받는 폰트 원본 하나, 없는 경로의 404를 확인한다.
      # 전파 지연을 고려해 몇 번 다시 시도한다.
      - name: 배포 스모크 테스트
        env:
          BASE_URL: https://typography-playground.seungwoo7050.workers.dev
        run: |
          for path in / /kinetic /fonts/space-grotesk/source.ttf; do
            curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null "$BASE_URL$path"
          done
          status=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/__smoke-not-found__")
          test "$status" = "404"
